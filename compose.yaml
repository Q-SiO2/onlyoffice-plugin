services:
  app:
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/paloalto.sqlite
      DEMO_MODE: 'false'
    volumes:
      - paloalto-data:/app/data
    restart: unless-stopped
volumes:
  paloalto-data:
